<!-- Estado de conexión -->
<div *ngIf="!conectado" class="text-center text-gray-700 p-4">
  Conectando al servidor WebSocket...
</div>

<!-- Contenedor principal del chat -->
<div *ngIf="conectado" class="h-screen bg-gray-300 flex items-center justify-center">
  <div class="w-80 h-96 bg-white rounded-2xl shadow-2xl flex flex-col">

    <!-- Cabecera del chat -->
    <nav class="h-10 bg-gray-900 rounded-t-2xl flex items-center justify-between px-2">
      <div class="flex items-center">
        <img src="https://i.imgur.com/IAgGUYF.jpg" class="w-6 h-6 rounded-full mr-1" />
        <span class="text-xs font-medium text-gray-300">{{ nombreUsuario }}</span>

      </div>
      <div class="flex items-center space-x-2 text-gray-300 text-base">
        <i class="mdi mdi-video"></i>
        <i class="mdi mdi-phone"></i>
        <i class="mdi mdi-dots-vertical"></i>
      </div>
    </nav>

    <!-- Área de mensajes -->
    <div class="flex-1 overflow-y-auto px-1 py-1" id="journal-scroll">
      <div
        *ngFor="let msg of mensajes"
        [ngClass]="msg.tipo === 'artista' ? 'flex items-center pr-10 pt-1' : 'flex justify-end pt-2 pl-10'"
      >
        <!-- Mensaje del artista -->
        <ng-container *ngIf="msg.tipo === 'artista'">
          <img src="https://i.imgur.com/IAgGUYF.jpg" class="w-4 h-4 rounded-full shadow mr-1" />
          <span class="bg-gray-900 text-gray-200 text-xs rounded px-2 py-1 flex items-end space-x-1">
            <span>{{ msg.texto }}</span>
            <span class="text-gray-400 text-[8px]">{{ msg.hora }}</span>
          </span>
        </ng-container>

        <!-- Mensaje del promotor -->
        <ng-container *ngIf="msg.tipo === 'promotor'">
          <span class="bg-green-900 text-gray-200 text-xs rounded px-2 py-1 flex items-end space-x-1">
            <span>{{ msg.texto }}</span>
            <span class="text-gray-400 text-[8px]">{{ msg.hora }}</span>
          </span>
        </ng-container>
      </div>
    </div>

    <!-- Input de mensajes -->
    <div class="flex items-center justify-between p-1">
      <div class="relative w-[250px]">
        <i class="mdi mdi-emoticon-excited-outline absolute top-1 left-1 text-gray-400 text-lg"></i>
        <input
          [(ngModel)]="mensajeInput"
          type="text"
          placeholder="Escribe un mensaje..."
          class="w-full rounded-full pl-6 pr-12 py-1 bg-gray-900 text-white placeholder-gray-100 text-xs focus:outline-none"
        />
        <i class="mdi mdi-paperclip absolute right-8 top-1 -rotate-45 text-gray-400"></i>
        <i class="mdi mdi-camera absolute right-2 top-1 text-gray-400"></i>
      </div>

      <!-- Botón enviar -->
      <button
        class="w-7 h-7 flex items-center justify-center bg-blue-300 rounded-full text-gray-900 hover:bg-gray-900 hover:text-white transition-colors duration-200 disabled:opacity-50"
        (click)="enviarMensaje()"
        [disabled]="!mensajeInput.trim()"
      >
        <i class="mdi mdi-send text-sm"></i>
      </button>
    </div>
  </div>
</div>
