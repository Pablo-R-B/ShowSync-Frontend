<div class="reproductor">
  <button class="play-btn" (click)="togglePlay()">
    {{ isPlaying ? '❚❚' : '▶' }}
  </button>
  <div class="song-info">
    <span class="text-sm text-white">Preview de canción</span>
    <span class="text-xs text-gray-400">{{ previewUrl ? '30 segundos disponibles' : 'No disponible' }}</span>
  </div>
</div>
