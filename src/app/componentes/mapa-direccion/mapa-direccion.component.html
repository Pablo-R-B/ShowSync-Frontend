<input
  type="text"
  placeholder="Buscar dirección"
  (input)="onInput($event)"
  class="border p-2 rounded mb-2 w-full"
/>

<ul *ngIf="sugerencias.length" class="border border-gray-600 rounded max-h-40 overflow-auto bg-white text-black mb-4">
  <li
    *ngFor="let sugerencia of sugerencias"
    (click)="seleccionarDireccion(sugerencia)"
    class="cursor-pointer p-2 hover:bg-gray-200"
  >
    {{ sugerencia.display_name }}
  </li>
</ul>

<div id="map" style="height: 400px; border-radius: 0.5rem;"></div>
