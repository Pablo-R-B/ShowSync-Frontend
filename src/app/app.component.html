
<div class="min-h-screen flex flex-col bg-black">

  <app-header *ngIf="mostrarHeader"></app-header>

  <!-- Este main ocupa el espacio disponible -->
  <main [class.pt-20]="mostrarHeader" class="flex-grow">
    <router-outlet></router-outlet>
    <iframe
      *ngIf="mostrarReproductor"
      title="Spotify Playlist"
      src="https://open.spotify.com/embed/playlist/1rxdRujbcd8RupxAymnaDT?utm_source=generator&theme=0"
      width="100%"
      height="380"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>


  </main>

  <app-footer *ngIf="showFooter"></app-footer>

</div>
