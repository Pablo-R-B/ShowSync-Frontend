<div class="min-h-screen bg-gradient-to-br from-customNegro via-customGrisOscurso to-customBurbundy relative overflow-hidden flex items-center justify-center">
  <!-- Animated background elements -->
  <div class="absolute inset-0 bg-cover bg-center opacity-80 blur-sm" style="background-image: url('assets/images/fondo_2.png')"></div>
  <div class="absolute inset-0 bg-gradient-to-br from-black via-transparent to-black"></div>

  <div class="relative z-10 backdrop-blur-xl bg-customNegro/80 border border-customRed/40 text-customBlanco pt-8 pb-12 px-12 rounded-3xl w-full max-w-lg shadow-2xl shadow-customBurbundy/60 transform hover:scale-[1.02] transition-all duration-500">
    <h2 class="text-5xl font-medula text-center mb-8 ">Recuperar contraseña</h2>

    <form (ngSubmit)="onRecuperar()" class="space-y-6">
      <p class="text-center text-gray-300 text-sm">
        Introduce tu correo electrónico y te enviaremos las instrucciones para recuperar tu contraseña.
      </p>

      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Correo electrónico"
        required
        [disabled]="loading"
        class="w-full pl-8 pr-4 py-4 rounded-2xl bg-customGrisClaro backdrop-blur-sm border border-customGrisClaro/30  text-customNegro   placeholder:text-customGrisOscurso    focus:outline-none focus:ring-2 focus:ring-customRed focus:border-transparent transition-all duration-300 hover:bg-customGrisClaro/80"
      />

      <button
        type="submit"
        class="w-full bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 px-6  transition duration-300 rounded-2xl"
        [disabled]="loading"
      >
        Enviar instrucciones
      </button>
      <div *ngIf="loading" class="flex justify-center items-center mt-2">
        <svg class="animate-spin h-5 w-5 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
        <span class="ml-2 text-gray-600">Cargando...</span>
      </div>

      <p *ngIf="mensaje" class="text-green-400 text-center mt-4">{{ mensaje }}</p>
      <p *ngIf="error" class="text-red-400 text-center mt-4">{{ error }}</p>

      <div class="text-center mt-4">
        <a routerLink="/auth/login" class="text-gray-300 hover:text-white hover:underline text-sm">Volver al login</a>
      </div>
    </form>


  </div>


</div>
