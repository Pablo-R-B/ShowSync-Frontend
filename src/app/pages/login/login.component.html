<div class="min-h-screen bg-gradient-to-br from-customNegro via-customGrisOscurso to-customBurbundy relative overflow-hidden flex items-center justify-center">
  <!-- Animated background elements -->
  <div class="absolute inset-0 bg-cover bg-center opacity-80 blur-sm" style="background-image: url('assets/images/fondo_2.png')"></div>
  <div class="absolute inset-0 bg-gradient-to-br from-black via-transparent to-black"></div>

  <!-- Floating musical notes animation -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/3 right-1/4 w-50 h-50 text-customRed opacity-70 animate-bounce">♪</div>
    <div class="absolute top-1/4 left-1/4 w-20 h-20 text-customGrisMedio opacity-50 animate-pulse">♫</div>
    <div class="absolute bottom-1/3 right-1/3 w-12 h-12 text-customGrisClaro opacity-40 animate-pulse delay-500">♪</div>
    <div class="absolute bottom-1/4 left-1/3 w-12 h-12 text-customNegro opacity-60 animate-bounce delay-1000">♫</div>
    <div class="absolute top-10 left-20 w-16 h-16 text-customRed opacity-50 animate-pulse">♪</div>
    <div class="absolute top-1/2 right-10 w-24 h-24 text-customGrisClaro opacity-60 animate-bounce">♫</div>
    <div class="absolute bottom-20 left-1/2 w-20 h-20 text-customGrisMedio opacity-40 animate-pulse delay-300">♪</div>
    <div class="absolute top-5 right-1/3 w-12 h-12 text-customNegro opacity-70 animate-bounce delay-700">♫</div>
    <div class="absolute bottom-1/4 right-1/4 w-18 h-18 text-customRed opacity-50 animate-pulse delay-500">♪</div>
    <div class="absolute top-1/3 left-1/5 w-14 h-14 text-customGrisClaro opacity-40 animate-bounce delay-200">♫</div>
    <div class="absolute bottom-10 left-10 w-22 h-22 text-customGrisMedio opacity-60 animate-pulse delay-800">♪</div>
    <div class="absolute top-1/4 right-1/6 w-16 h-16 text-customNegro opacity-50 animate-bounce delay-400">♫</div>
  </div>

  <!-- Tarjeta -->
  <div class="relative z-10 backdrop-blur-xl bg-customNegro/80 border border-customRed/40 text-customBlanco pt-8 pb-12 px-12 rounded-3xl w-full max-w-lg shadow-2xl shadow-customBurbundy/60 transform hover:scale-[1.02] transition-all duration-500">

    <!-- Efectos -->
    <div class="absolute -inset-1 bg-gradient-to-r-l from-customNegro via-customRed to-customBurbundy rounded-3xl blur-sm opacity-40 group-hover:opacity-60 transition duration-1000"></div>

    <div class="relative">
      <div class="flex justify-center mb-8 transform hover:scale-105 transition-transform duration-300">
        <div class="relative">
          <img src="assets/images/logo_1.png" alt="Logo" class="w-80 h-40 md:w-96 md:h-48 lg:w-[28rem] lg:h-56 drop-shadow-2xl">
          <div ></div>
        </div>
      </div>

      <div class="text-center mb-10">
        <h2 class="text-4xl font-medula text-white bg-clip-text text-transparent tracking-wide uppercase drop-shadow-lg">
          Iniciar Sesión
        </h2>
        <div class="w-24 h-1 bg-gradient-to-r from-customBurbundy to-customRed mx-auto mt-4 rounded-full"></div>
      </div>

      <!-- Enhanced form -->
      <form (ngSubmit)="onLogin()" class="space-y-6">
        <!-- Email input with icon -->
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <svg class="w-5 h-5 text-customGrisClaro group-focus-within:text-customRed transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
            </svg>
          </div>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Correo electrónico"
            required
            class="w-full pl-12 pr-4 py-4 rounded-2xl bg-customGrisOscurso/90 backdrop-blur-sm border border-customGrisClaro/30 text-customBlanco placeholder:text-customGrisMedio focus:outline-none focus:ring-2 focus:ring-customRed focus:border-transparent transition-all duration-300 hover:bg-customGrisOscurso/80"
          />
        </div>

        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <svg class="w-5 h-5 text-customGrisClaro group-focus-within:text-customRed transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="contrasena"
            name="contrasena"
            placeholder="Contraseña"
            required
            class="w-full pl-12 pr-12 py-4 rounded-2xl bg-customGrisOscurso/70 backdrop-blur-sm border border-customGrisClaro/30 text-customBlanco placeholder:text-customGrisMedio focus:outline-none focus:ring-2 focus:ring-customRed focus:border-transparent transition-all duration-300 hover:bg-customGrisOscurso/80"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-4 flex items-center text-customGrisClaro hover:text-customRed transition-colors duration-200 focus:outline-none"
          >
            <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
            </svg>
          </button>
        </div>

        <!-- Checkbox para mantener sesión -->
        <div class="flex items-center space-x-3 pt-2">
          <div class="relative">
            <input
              type="checkbox"
              id="keepSession"
              [(ngModel)]="keepSession"
              name="keepSession"
              (change)="onKeepSessionChange()"
              class="sr-only"
            />
            <label
              for="keepSession"
              class="flex items-center cursor-pointer select-none"
            >
              <div class="relative">
                <div class="w-5 h-5 rounded border-2 border-customGrisClaro/50 bg-customGrisOscurso/60 backdrop-blur-sm transition-all duration-200 hover:border-customRed/70"
                     [class.bg-customRed]="keepSession"
                     [class.border-customRed]="keepSession">
                  <svg *ngIf="keepSession" class="w-3 h-3 text-white absolute top-0.5 left-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                  </svg>
                </div>
              </div>
              <span class="ml-3 text-customGrisClaro hover:text-customBlanco transition-colors duration-200 text-sm">
                Mantener sesión iniciada
              </span>
            </label>
          </div>
        </div>

        <div class="flex flex-col space-y-3 text-center pt-2">
          <a routerLink="/auth/recuperar"
             class="text-customGrisMedio hover:text-customRed hover:underline text-sm transition-colors duration-300 transform hover:scale-105">
            ¿Has olvidado tu contraseña?
          </a>
          <a routerLink="/auth/registro"
             class="text-customGrisMedio hover:text-customGrisClaro hover:underline text-sm transition-colors duration-300 transform hover:scale-105">
            ¿No tienes cuenta? Regístrate aquí
          </a>
          <!-- Ir a la pagina de inicio sin logueo -->
          <a routerLink="/"
             class="text-customGrisMedio hover:text-customGrisClaro hover:underline text-sm transition-colors duration-300 transform hover:scale-105 ml-4 flex items-center justify-end">
            Ir a la página de inicio
            <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
          </a>
        </div>

        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full relative overflow-hidden bg-gradient-to-r from-customBurbundy to-customRed hover:from-customRed hover:to-customBurbundy text-customBlanco font-bold py-4 px-8 rounded-2xl transition-all duration-300 shadow-lg shadow-customBurbundy/50 hover:shadow-xl hover:shadow-customRed/60 transform hover:scale-[1.02] hover:-translate-y-1 group disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
        >
          <span class="relative z-10 flex items-center justify-center space-x-2">
            <span *ngIf="!isLoading">Entrar</span>
            <span *ngIf="isLoading">Iniciando...</span>
            <svg *ngIf="!isLoading" class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
            <svg *ngIf="isLoading" class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
          </span>
          <div class="absolute inset-0 bg-gradient-to-r from-customRed to-customBurbundy opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        </button>

        <div *ngIf="error" class="text-center mt-6">
          <div class="inline-flex items-center space-x-2 bg-customBurbundy/30 border border-customRed/50 rounded-lg px-4 py-3 text-customGrisClaro backdrop-blur-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
            </svg>
            <span>{{ error }}</span>
          </div>
        </div>
      </form>
    </div>


  </div>

  <div class="absolute top-10 left-10 w-32 h-32 bg-customBurbundy/20 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute bottom-10 right-10 w-48 h-48 bg-customRed/15 rounded-full blur-3xl animate-pulse delay-1000"></div>
  <div class="absolute top-1/2 left-5 w-24 h-24 bg-customGrisOscurso/30 rounded-full blur-2xl animate-bounce"></div>
</div>
