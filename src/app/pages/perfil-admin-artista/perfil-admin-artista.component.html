<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

<div class="bg-[#7e001b] min-h-screen text-white font-sans pt-[80px] pb-[60px] px-[10%]">

  <!-- Info del artista -->
  <div class="p-8 flex items-center gap-8 px-6 sm:ml-[10%] bg-[#4c0012] rounded-lg shadow-lg">
    <img [src]="artista?.imagenPerfil"
         [alt]="artista?.nombreArtista"
         class="w-24 h-24 rounded-full border-4 border-white shadow-md object-cover" />
    <div>
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-wide drop-shadow-lg">{{ artista?.nombreArtista }}</h1>
      <!--    <p class="mt-2 max-w-lg text-lg text-gray-300 leading-relaxed">{{ promotor?.descripcion }}</p>-->
    </div>

  </div>

  <!-- Botón Editar Mi Perfil -->
  <div class="flex justify-center mt-12 mb-[75px]">
    <button class="bg-[#e4e4e4] text-black px-10 py-4 text-2xl rounded-2xl shadow-md hover:bg-[#d4d4d4] transition font-semibold"
            [routerLink]="['/datos-artista']">
      EDITAR MI PERFIL <i class="fas fa-user-edit ml-2"></i>
    </button>
  </div>

  <!-- Panel de Gestión -->
  <div class="grid md:grid-cols-2 gap-8 mb-10 pb-6">

    <!-- Solicitud de Artista -->
    <div class="bg-[#1f1f1f] p-6 rounded-2xl shadow-lg">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold flex items-center gap-2">
          <i class="fas fa-microphone text-white"></i> SOLICITUDES DE PROMOTOR
        </h2>
      </div>

      <!-- COLUMNA 2: Ofertas -->
      <div class="flex flex-col gap-6">

        <!-- Ofertas Pendientes -->
        <label class="w-full">
          <input class="peer/showLabel absolute scale-0" type="checkbox" />
          <span class="block max-h-14 overflow-hidden rounded-lg bg-yellow-100 px-4 py-0 text-yellow-800 shadow-lg transition-all duration-300 peer-checked/showLabel:max-h-[1000px]">
          <h3 class="flex h-14 cursor-pointer items-center font-bold px-4">📨 Ofertas Pendientes</h3>
          <div *ngIf="ofertasPendientes.length > 0; else noOfertasPend" class="grid gap-4 p-4 max-h-[500px] overflow-y-auto">
            <div *ngFor="let oferta of ofertasPendientes" class="flex gap-4 p-4 bg-white rounded-xl shadow-md">
              <img [src]="oferta.eventoImagen" alt="Evento" class="w-24 h-24 object-cover rounded-lg" />
              <div>
                <h4 class="font-bold text-lg">{{ oferta.eventoNombre }}</h4>
                <p><span class="font-semibold">Artista:</span> {{ oferta.artistaNombre }}</p>
                <p><span class="font-semibold">Sala:</span> {{ oferta.salaNombre }}</p>
                <p><span class="font-semibold">Fecha Postulación:</span> {{ oferta.fechaPostulacion | date }}</p>
                    <div class="flex gap-2 mt-3" *ngIf="oferta.estado === 'pendiente'">
                    <button class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded-full font-semibold" (click)="respuestaSolicitud(oferta, 'aceptado')">Aceptar</button>
                    <button class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-full font-semibold" (click)="respuestaSolicitud(oferta, 'rechazado')">Rechazar</button>
                  </div>
              </div>
            </div>
          </div>
          <ng-template #noOfertasPend>
            <p class="px-4 py-2 text-sm italic">No hay ofertas pendientes.</p>
          </ng-template>
        </span>
        </label>

        <!-- Ofertas Aceptadas -->
        <label class="w-full">
          <input class="peer/showLabel absolute scale-0" type="checkbox" />
          <span class="block max-h-14 overflow-hidden rounded-lg bg-blue-100 px-4 py-0 text-blue-800 shadow-lg transition-all duration-300 peer-checked/showLabel:max-h-[1000px]">
          <h3 class="flex h-14 cursor-pointer items-center font-bold px-4">🎉 Ofertas Aceptadas</h3>
          <div *ngIf="ofertasAceptadas.length > 0; else noOfertasAcept" class="grid gap-4 p-4 max-h-[500px] overflow-y-auto">
            <div *ngFor="let oferta of ofertasAceptadas" class="flex gap-4 p-4 bg-white rounded-xl shadow-md">
              <img [src]="oferta.eventoImagen" alt="Evento" class="w-24 h-24 object-cover rounded-lg" />
              <div>
                <h4 class="font-bold text-lg">{{ oferta.eventoNombre }}</h4>
                <p><span class="font-semibold">Artista:</span> {{ oferta.artistaNombre }}</p>
                <p><span class="font-semibold">Sala:</span> {{ oferta.salaNombre }}</p>
                <p><span class="font-semibold">Fecha Postulación:</span> {{ oferta.fechaPostulacion | date }}</p>
              </div>
            </div>
          </div>
          <ng-template #noOfertasAcept>
            <p class="px-4 py-2 text-sm italic">No hay ofertas aceptadas.</p>
          </ng-template>
        </span>
        </label>

      </div>



<!--    </div>-->



  </div>

    <!-- Solicitud de Promotor -->
    <div  class="bg-[#1f1f1f] p-6 rounded-2xl shadow-lg">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold flex items-center gap-2">
          <i class="fas fa-user-tie text-white"></i> SOLICITUDES DE ARTISTA
        </h2>
      </div>
      <!-- COLUMNA 1: Postulaciones -->
      <div class="flex flex-col gap-6">

        <!-- Postulaciones Pendientes -->
        <label class="w-full">
          <input class="peer/showLabel absolute scale-0" type="checkbox" />
          <span class="block max-h-14 overflow-hidden rounded-lg bg-emerald-100 px-4 py-0 text-cyan-800 shadow-lg transition-all duration-300 peer-checked/showLabel:max-h-[600px]">
          <h3 class="flex h-14 cursor-pointer items-center font-bold px-4">🎤 Postulaciones Pendientes</h3>

          <div class="max-h-[500px] overflow-y-auto" *ngIf="postulacionesPendientes.length > 0; else noPostPend">
            <div class="grid gap-4 p-4">
              <div *ngFor="let post of postulacionesPendientes" class="flex flex-col md:flex-row gap-4 p-4 bg-white rounded-xl shadow-md items-start md:items-center">
                <img [src]="post.eventoImagen" alt="Evento" class="w-24 h-24 object-cover rounded-lg shrink-0" />
                <div class="flex-1">
                  <h4 class="font-bold text-lg">{{ post.eventoNombre }}</h4>
                  <p><span class="font-semibold">Artista:</span> {{ post.artistaNombre }}</p>
                  <p><span class="font-semibold">Sala:</span> {{ post.salaNombre }}</p>
                  <p><span class="font-semibold">Fecha Postulación:</span> {{ post.fechaPostulacion | date }}</p>

                </div>
              </div>
            </div>
          </div>
          <ng-template #noPostPend>
            <p class="px-4 py-2 text-sm italic">No hay postulaciones pendientes.</p>
          </ng-template>
        </span>
        </label>

        <!-- Postulaciones Aceptadas -->
        <label class="w-full">
          <input class="peer/showLabel absolute scale-0" type="checkbox" />
          <span class="block max-h-14 overflow-hidden rounded-lg bg-green-100 px-4 py-0 text-green-800 shadow-lg transition-all duration-300 peer-checked/showLabel:max-h-[1000px]">
          <h3 class="flex h-14 cursor-pointer items-center font-bold px-4">✅ Postulaciones Aceptadas</h3>
          <div *ngIf="postulacionesAceptadas.length > 0; else noPostAcept" class="grid gap-4 p-4 max-h-[500px] overflow-y-auto">
            <div *ngFor="let post of postulacionesAceptadas" class="flex gap-4 p-4 bg-white rounded-xl shadow-md">
              <img [src]="post.eventoImagen" alt="Evento" class="w-24 h-24 object-cover rounded-lg" />
              <div>
                <h4 class="font-bold text-lg">{{ post.eventoNombre }}</h4>
                <p><span class="font-semibold">Artista:</span> {{ post.artistaNombre }}</p>
                <p><span class="font-semibold">Sala:</span> {{ post.salaNombre }}</p>
                <p><span class="font-semibold">Fecha Postulación:</span> {{ post.fechaPostulacion | date }}</p>
              </div>
            </div>
          </div>
          <ng-template #noPostAcept>
            <p class="px-4 py-2 text-sm italic">No hay postulaciones aceptadas.</p>
          </ng-template>
        </span>
        </label>

      </div>


<!--    </div>-->


  </div>
  </div>


  <!-- Gestión de Eventos -->
    <div class="bg-[#1f1f1f] p-6 rounded-2xl shadow-lg">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold flex items-center gap-2">
          <i class="fas fa-ticket-alt text-white"></i> EVENTOS
        </h2>
      </div>
      <ul class="space-y-4">
        <li *ngFor="let evento of eventos" class="bg-[#2b2b2b] p-4 rounded-xl shadow flex justify-between items-center">
          <div>
            <h3 class="font-semibold text-lg">{{ evento.nombreEvento }}</h3>
            <p class="text-sm text-gray-400">{{ evento.fechaEvento | date:'dd/MM/yyyy' }}</p>
            <p class="text-sm text-gray-400">{{ evento.nombreSala }}</p>
          </div>
          <div class="flex gap-3">
            <!-- Icono de edición -->
<!--            <button class="text-yellow-400 hover:text-yellow-300 text-xl flex items-center"-->
<!--                    [routerLink]="['/promotores', promotor?.id, 'eventos', evento.id, 'editar']">-->
<!--              <i class="fas fa-pencil-alt"></i>-->
<!--            </button>-->

<!--            &lt;!&ndash; Icono de eliminación &ndash;&gt;-->
<!--            <button class="text-red-500 hover:text-red-400 text-xl flex items-center"-->
<!--                    (click)="eliminarEvento(evento.id)">-->
<!--              <i class="fas fa-trash-alt"></i>-->
<!--            </button>-->
          </div>
        </li>
        <li *ngIf="eventos.length === 0" class="text-gray-400">No hay eventos para mostrar.</li>
      </ul>
    </div>
  </div>

  <!-- Botón Gestionar Salas -->
  <div class="flex justify-center mt-12 mb-[75px]">
    <button class="bg-[#e4e4e4] text-black px-10 py-4 text-2xl rounded-2xl shadow-md hover:bg-[#d4d4d4] transition font-semibold"
            [routerLink]="['/eventos']">
      CATÁLOGO EVENTOS<i class="fas fa-book ml-2"></i>
    </button>
  </div>

<div class="fixed z-10 inset-0 overflow-y-auto" *ngIf="modalVisible">
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
    <!-- Fondo oscuro -->
    <div class="fixed inset-0 transition-opacity">
      <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
    </div>

    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

    <!-- Contenido del Modal -->
    <div
      class="inline-block align-bottom bg-white rounded-lg px-4 pt-5 pb-4 text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full sm:p-6">

      <!-- Icono y texto -->
      <div class="sm:flex sm:items-start">
        <div
          class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full sm:mx-0 sm:h-10 sm:w-10"
          [ngClass]="modalTipo === 'exito' ? 'bg-green-100' : 'bg-red-100'">
          <svg *ngIf="modalTipo === 'exito'" class="h-6 w-6 text-green-600" stroke="currentColor" fill="none"
               viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          <svg *ngIf="modalTipo === 'error'" class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg"
               fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M6 18L18 6M6 6l12 12" />
          </svg>
        </div>

        <!-- Título y mensaje -->
        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
          <h3 class="text-lg leading-6 font-medium text-gray-900">
            {{ modalTitulo }}
          </h3>
          <div class="mt-2">
            <p class="text-sm leading-5 text-gray-500">
              {{ modalMensaje }}
            </p>
          </div>
        </div>
      </div>

      <!-- Botón único -->
      <div class="mt-5 sm:mt-4 sm:flex sm:flex-row-reverse">
        <span class="flex w-full rounded-md shadow-sm sm:ml-3 sm:w-auto">
          <button type="button"
                  (click)="cerrarModalYRecargar()"
                  [ngClass]="modalTipo === 'exito' ? 'bg-green-600 hover:bg-green-500 focus:shadow-outline-green' : 'bg-red-600 hover:bg-red-500 focus:shadow-outline-red'"
                  class="inline-flex justify-center w-full rounded-md border border-transparent px-4 py-2 text-base leading-6 font-medium text-white shadow-sm focus:outline-none transition ease-in-out duration-150 sm:text-sm sm:leading-5">
            Aceptar
          </button>
        </span>
      </div>
    </div>
  </div>
</div>
