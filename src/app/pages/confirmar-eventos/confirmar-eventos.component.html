<div
  class="min-h-screen bg-cover bg-center flex items-center justify-center"
  style="background-image: url('../../../assets/images/img_4.png');"
>
  <div class="bg-black bg-opacity-80 p-8 rounded-3xl max-w-md w-full shadow-lg">
    <h2 class="font-medula text-white text-5xl mb-6 text-center">Confirmar Evento</h2>
    <hr class="border-gray-600 mb-6" />

    <form [formGroup]="editarEventoForm" (ngSubmit)="onSubmit()">

      <!-- Nombre del Evento -->
      <div class="mb-4">
        <input
          id="nombreEvento"
          type="text"
          placeholder="Nombre del Evento"
          formControlName="nombreEvento"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 placeholder-gray-500
                 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
        />
        <div *ngIf="hasError('nombreEvento', 'required')" class="text-red-500 text-sm">
          El nombre del evento es obligatorio.
        </div>
      </div>

      <!-- Descripción -->
      <div class="mb-4">
        <textarea
          id="descripcion"
          placeholder="Descripción"
          formControlName="descripcion"
          class="w-full p-3 rounded-lg bg-gray-200 text-gray-800 placeholder-gray-500
                 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
        ></textarea>
      </div>

      <!-- Sala ID -->
      <div class="mb-4">
        <select
          id="salaId"
          formControlName="salaId"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800
                 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
        >
          <option value="">--Selecciona sala--</option>
          <option *ngFor="let sala of salas" [value]="sala.id">{{ sala.nombre }}</option>
        </select>
        <div *ngIf="hasError('salaId', 'required')" class="text-red-500 text-sm">
          El ID de la sala es obligatorio.
        </div>
      </div>

      <!-- Estado -->
      <div class="mb-4">
        <select
          id="estado"
          formControlName="estado"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800
                 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
        >
          <option value="" disabled>Selecciona el estado</option>
          <option *ngFor="let est of estados" [value]="est">{{ est }}</option>
        </select>
        <div *ngIf="hasError('estado', 'required')" class="text-red-500 text-sm">
          El estado es obligatorio.
        </div>
      </div>

      <!-- Imagen del Evento -->
      <div class="mb-4">
        <input
          id="imagenEvento"
          type="text"
          placeholder="URL de la Imagen del Evento"
          formControlName="imagenEvento"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 placeholder-gray-500
                 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
        />
      </div>

      <!-- Botón Guardar -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-customGrisOscurso hover:bg-gray-500 text-white py-3 rounded-full
               text-lg font-semibold transition duration-300"
      >
        {{ loading ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </form>
  </div>
</div>
