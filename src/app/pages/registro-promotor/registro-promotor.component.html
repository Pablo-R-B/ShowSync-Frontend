<div class="min-h-screen bg-cover bg-center flex items-center justify-center" style="background-image: url('../../../assets/images/img.png');">
  <div class="bg-black bg-opacity-80 p-8 rounded-3xl max-w-md w-full shadow-lg">

    <h2 class="font-medula text-white text-5xl mb-6 text-center">Datos Promotor</h2>
    <hr class="border-gray-600 mb-6">

    <form [formGroup]="registroPromotorForm" (ngSubmit)="onSubmit()">
      <!-- Nombre del Promotor -->
      <div class="mb-4">
        <input
          type="text"
          placeholder="Nombre del Promotor"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 placeholder-gray-500 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
          formControlName="nombrePromotor"
        />
        <div *ngIf="hasError('nombrePromotor', 'required')" class="text-red-500 text-sm">
          El nombre del promotor es obligatorio.
        </div>
      </div>

      <!-- Descripción -->
      <div class="mb-4">
  <textarea
    placeholder="Descripción"
    class="w-full p-3 rounded-lg bg-gray-200 text-gray-800 placeholder-gray-500 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
    formControlName="descripcion"
  ></textarea>
        <div *ngIf="hasError('descripcion', 'required')" class="text-red-500 text-sm">
          La descripción es obligatoria.
        </div>
      </div>

      <!-- Imagen de Perfil -->
      <div class="mb-4">
        <input
          type="text"
          placeholder="URL de la Imagen de Perfil"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 placeholder-gray-500 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
          formControlName="imagenPerfil"
        />
        <div *ngIf="hasError('imagenPerfil', 'required')" class="text-red-500 text-sm">
          La imagen de perfil es obligatoria.
        </div>
      </div>


      <!-- Botón de registro -->
      <button
        type="submit"
        class="w-full bg-customGrisOscurso text-white py-3 rounded-full text-lg font-semibold transition duration-300
         hover:bg-gray-500"
        [disabled]="loading || registroPromotorForm.invalid"
        [ngClass]="{
        'cursor-not-allowed opacity-60': registroPromotorForm.invalid || loading,
        'cursor-pointer': !registroPromotorForm.invalid && !loading
      }"
      >
        {{ loading ? 'Guardando...' : perfilCompleto ? 'Guardar Cambios' : 'Registrarse' }}
      </button>



      <!-- Botón de salir sin guardar -->
      <button
        *ngIf="perfilCompleto"
        type="button"
        (click)="router.navigate(['/perfil-promotores'])"
      class="w-full mt-2 bg-gray-600 hover:bg-gray-700 text-white py-3 rounded-full text-lg font-semibold transition duration-300"
      >
      Salir
      </button>
      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

    </form>
  </div>
</div>
