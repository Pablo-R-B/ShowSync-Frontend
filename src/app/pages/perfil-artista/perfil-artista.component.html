<section class="py-10 my-auto dark:bg-gray-900">
  <div class="lg:w-[80%] md:w-[90%] w-[96%] mx-auto flex gap-4 ">
    <div class=" sm:p-12 dark:bg-gray-50 dark:text-gray-800 ">

      <div class="p-10">
        <!-- Mensaje de éxito -->
        <div
          *ngIf="alerta.visible && alerta.tipo === 'enviada'"
          class="font-regular relative mb-4 block w-full
           rounded-lg bg-green-500 p-4 text-base leading-5
           text-white opacity-100"
        >
          {{ alerta.mensaje }}
        </div>


        <div
          *ngIf="alerta.visible && alerta.tipo === 'noenviada'"
          class="font-regular relative mb-4 block w-full
           rounded-lg p-4 text-base leading-5
           text-white opacity-100"
        >
          {{ alerta.mensaje }}
        </div>
      </div>
      <div *ngIf="artista" >
        <div  class=" img-artista flex flex-col space-y-4 md:space-y-0 md:space-x-6 md:flex-row w-full h-auto p-10 -mr-5 -mt-5  -ml-5" [style.backgroundImage]="'url(' + artista.imagenPerfil + ')'">
          <img class="self-center flex-shrink-0 w-40 h-40 border rounded-full md:justify-self-start dark:bg-gray-500 dark:border-gray-300"
               alt=""
               src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9YYh5Fk1u9VsWWr1MhkyQeOzeNbtnnMO96g&s">

          <div class="flex flex-col">
            <h4 class="text-lg font-semibold text-center md:text-left mb-2">{{artista.nombreArtista}}</h4>
            <div class="text-center">
              <span class="text-2xl font-bold block uppercase tracking-wide text-blueGray-600">22</span>
              <span class="text-lg text-blueGray-400">Friends</span>
            </div>
          </div>
        </div>
      </div>






      <div *ngIf="artista" class="flex flex-col lg:flex-row justify-between mt-12 py-10 border-t border-blueGray-200">

        <!-- IZQUIERDA -->
        <div class="w-full lg:w-1/3 mb-4 flex flex-col items-center text-center">
          <img
            class=" w-40 h-40 border rounded-full dark:bg-gray-500 dark:border-gray-300"
            alt=""
            [src]="artista.imagenPerfil"
          >

          <div class="flex flex-col items-center space-y-2 mt-4">
            <!-- GitHub -->
            <a [href]="artista.musicUrl" target="_blank" class="p-2 rounded-md dark:text-gray-800">
              Mi música
            </a>
            <a href="#" class="p-2 rounded-md dark:text-gray-800 hover:dark:text-violet-600">
              <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 fill-current">
                <path d="M256 8C119.252 8 8 119.252 8 256s111.252 248 248 248 248-111.252 248-248S392.748 8 256 8zm163.97 114.366c29.503 36.046 47.369 81.957 47.835 131.955-6.984-1.477-77.018-15.682-147.502-6.818-5.752-14.041-11.181-26.393-18.617-41.614 78.321-31.977 113.818-77.482 118.284-83.523zM396.421 97.87c-3.81 5.427-35.697 48.286-111.021 76.519-34.712-63.776-73.185-116.168-79.04-124.008 67.176-16.193 137.966 1.27 190.061 47.489zm-230.48-33.25c5.585 7.659 43.438 60.116 78.537 122.509-99.087 26.313-186.36 25.934-195.834 25.809C62.38 147.205 106.678 92.573 165.941 64.62zM44.17 256.323c0-2.166.043-4.322.108-6.473 9.268.19 111.92 1.513 217.706-30.146 6.064 11.868 11.857 23.915 17.174 35.949-76.599 21.575-146.194 83.527-180.531 142.306C64.794 360.405 44.17 310.73 44.17 256.323zm81.807 167.113c22.127-45.233 82.178-103.622 167.579-132.756 29.74 77.283 42.039 142.053 45.189 160.638-68.112 29.013-150.015 21.053-212.768-27.882zm248.38 8.489c-2.171-12.886-13.446-74.897-41.152-151.033 66.38-10.626 124.7 6.768 131.947 9.055-9.442 58.941-43.273 109.844-90.795 141.978z"></path>
              </svg>
            </a>
            <a href="#" class="p-2 rounded-md dark:text-gray-800 hover:dark:text-violet-600">
              <!-- SVG Twitter -->
            </a>
            <a href="#" class="p-2 rounded-md dark:text-gray-800 hover:dark:text-violet-600">
              <!-- SVG Email -->
            </a>
          </div>
        </div>

        <div class="w-full lg:w-2/3 px-4 mt-10 lg:mt-0 text-center">
          <p class="mb-4 text-lg leading-relaxed text-blueGray-700">
            {{artista.biografia}}
          </p>
          <div  *ngIf="usuarioRol === 'PROMOTOR'"  class="flex justify-center mt-12 mb-[75px]">
            <button (click)="mostrarModal = true"
                   >
              Contratar
            </button>
            <div class="modal" *ngIf="mostrarModal">
              <div class="modal-content">
                <h2>Vas a contratar a un artista</h2>
                <hr>
                <p>Eventos:</p>

                Input desplegable
                <label for="eventSelect">Selecciona un evento:</label>
                <div *ngIf="!eventos.length">
                  <p>No tienes eventos disponibles para ofrecer.</p>
                </div>
                <select  id="eventSelect" [(ngModel)]="eventoSeleccionado" name="eventoSeleccionado">
                  <option  *ngFor="let evento of eventos" [value]="evento.id">{{evento.nombreEvento}}</option>
                </select>

                <div class="modal-actions">
                  <button (click)="cerrarModal()">Cancelar</button>
                  <button (click)="enviarOferta(); cerrarModal()">Aceptar</button>
                </div>
              </div>
            </div>

          </div>
          <div *ngIf="usuarioRol === 'ARTISTA'" class="flex justify-center gap-6 mt-6">
            <button class="bg-gray-200 text-black px-8 py-3 text-lg rounded-xl shadow-md hover:bg-gray-300 transition font-semibold"
                    [routerLink]="['/datos-artista']">
              EDITAR MI PERFIL <i class="fas fa-user-edit ml-2"></i>
            </button>

            <button class="bg-gray-200 text-black px-8 py-3 text-lg rounded-xl shadow-md hover:bg-gray-300 transition font-semibold"
                    [routerLink]="['/admin-artista']">
              ADMINISTRAR MI PERFIL <i class="fas fa-user-edit ml-2"></i>
            </button>
          </div>


        </div>
      </div>
    </div>
  </div>
</section>
