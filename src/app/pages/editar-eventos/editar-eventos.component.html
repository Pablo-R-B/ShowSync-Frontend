<div
  class="min-h-screen bg-cover bg-center flex items-center justify-center"
  style="background-image: url('../../../assets/images/img_4.png');"
>
  <div class="bg-black bg-opacity-80 p-8 rounded-3xl max-w-md w-full shadow-lg">
    <h2 class="font-medula text-white text-5xl mb-6 text-center">Editar Evento</h2>
    <hr class="border-gray-600 mb-6" />

    <form [formGroup]="editarEventoForm" (ngSubmit)="onSubmit()">

      <!-- Nombre del Evento -->
      <div class="mb-4">
        <input
          id="nombreEvento"
          type="text"
          placeholder="Nombre del Evento"
          formControlName="nombreEvento"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 placeholder-gray-500
             focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
        />
        <div *ngIf="hasError('nombreEvento', 'required')" class="text-red-500 text-sm">
          El nombre del evento es obligatorio.
        </div>
      </div>

      <!-- Descripción -->
      <div class="mb-4">
    <textarea
      id="descripcion"
      placeholder="Descripción"
      formControlName="descripcion"
      class="w-full p-3 rounded-lg bg-gray-200 text-gray-800 placeholder-gray-500
             focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
    ></textarea>
      </div>

      <!-- Sala ID (cambiado a idSala) -->
      <div class="mb-4">
        <select
          id="idSala"
          formControlName="idSala"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800
             focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
        >
          <option value="">--Selecciona sala--</option>
          <option *ngFor="let sala of salas" [value]="sala.id">{{ sala.nombre }}</option>
        </select>
        <div *ngIf="hasError('idSala', 'required')" class="text-red-500 text-sm">
          El ID de la sala es obligatorio.
        </div>
      </div>

      <!-- Estado -->
      <div class="mb-4">
        <select
          id="estado"
          formControlName="estado"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800
             focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
        >
          <option value="" disabled>Selecciona el estado</option>
          <option *ngFor="let est of estados" [value]="est">{{ est }}</option>
        </select>
        <div *ngIf="hasError('estado', 'required')" class="text-red-500 text-sm">
          El estado es obligatorio.
        </div>
      </div>

      <!-- Artistas Asignados (añadido input hidden para enviar datos) -->
      <input type="hidden" formControlName="artistasAsignados" />
      <div class="mb-4">
        <button
          id="dropdownArtistasButton"
          data-dropdown-toggle="dropdownArtistas"
          data-dropdown-placement="bottom"
          type="button"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none
             focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center
             inline-flex items-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
          (click)="toggleDropdown()"
        >
          Artistas Asignados
          <svg class="w-2.5 h-2.5 ms-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"/>
          </svg>
        </button>

        <!-- Dropdown -->
        <div id="dropdownArtistas" [class.hidden]="!dropdownVisible" class="z-10 bg-white rounded-lg shadow-sm w-60 dark:bg-gray-700">
          <ul class="h-48 py-2 overflow-y-auto text-gray-700 dark:text-gray-200" aria-labelledby="dropdownArtistasButton">
            <li *ngFor="let artista of artistasSeleccionados">
              <a href="#" class="flex items-center px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">
                <img class="w-6 h-6 me-2 rounded-full" src="/assets/images/default-profile.png" alt="Artista" />
                {{ artista }}
                <button type="button" (click)="eliminarArtista(artista)" class="ml-auto text-red-600 hover:text-red-800">×</button>
              </a>
            </li>
          </ul>
          <div class="p-3">
            <input
              type="text"
              [formControl]="nuevoArtistaControl"
              placeholder="Agregar artista"
              class="w-full px-4 py-2 rounded bg-gray-200 text-gray-800"
            />
            <button type="button" (click)="agregarArtista()" class="mt-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
              Agregar
            </button>
          </div>
        </div>
        <div *ngIf="hasError('artistasAsignados', 'required')" class="text-red-500 text-sm">
          Los artistas asignados son obligatorios.
        </div>
      </div>

      <!-- Estado de Postulación -->
      <div class="mb-4">
        <select
          id="estadoPublicacion"
          formControlName="estadoPublicacion"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800
             focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
        >
          <option value="" disabled>Selecciona el estado de publicación</option>
          <option *ngFor="let estado of estadosPublicacion" [value]="estado">{{ estado }}</option>
        </select>
        <div *ngIf="hasError('estadoPublicacion', 'required')" class="text-red-500 text-sm">
          El estado de publicación es obligatorio.
        </div>
      </div>

      <!-- Imagen del Evento -->
      <div class="mb-4">
        <input
          id="imagenEvento"
          type="text"
          placeholder="URL de la Imagen del Evento"
          formControlName="imagenEvento"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 placeholder-gray-500
             focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
        />
      </div>

      <!-- Botón Guardar -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-customGrisOscurso hover:bg-gray-500 text-white py-3 rounded-full
           text-lg font-semibold transition duration-300"
      >
        {{ loading ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </form>
