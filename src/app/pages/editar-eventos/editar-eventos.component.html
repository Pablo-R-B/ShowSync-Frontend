<div class="min-h-screen bg-cover bg-center flex items-center justify-center" style="background-image: url('../../../assets/images/img_4.png');">
  <div class="bg-black bg-opacity-80 p-8 rounded-3xl max-w-md w-full shadow-lg">
    <h2 class="font-medula text-white text-5xl mb-6 text-center">Editar Evento</h2>
    <hr class="border-gray-600 mb-6">

    <form [formGroup]="editarEventoForm" (ngSubmit)="onSubmit()">

      <!-- Nombre del Evento -->
      <div class="mb-4">
        <label for="nombreEvento" class="sr-only">Nombre del Evento</label>
        <input
          id="nombreEvento"
          type="text"
          placeholder="Nombre del Evento"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 placeholder-gray-500 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
          formControlName="nombreEvento"
        />
        <div *ngIf="hasError('nombreEvento', 'required')" class="text-red-500 text-sm">
          El nombre del evento es obligatorio.
        </div>
      </div>

      <!-- Descripción -->
      <div class="mb-4">
        <label for="descripcion" class="sr-only">Descripción</label>
        <textarea
          id="descripcion"
          placeholder="Descripción"
          class="w-full p-3 rounded-lg bg-gray-200 text-gray-800 placeholder-gray-500 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
          formControlName="descripcion"
        ></textarea>
      </div>

      <!-- Fecha del Evento -->
      <div class="mb-4">
        <label for="fechaEvento" class="sr-only">Fecha del Evento</label>
        <input
          id="fechaEvento"
          type="date"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
          formControlName="fechaEvento"
        />
        <div *ngIf="hasError('fechaEvento', 'required')" class="text-red-500 text-sm">
          La fecha del evento es obligatoria.
        </div>
      </div>

      <!-- Sala ID -->
      <div class="mb-4">
        <label for="salaId" class="sr-only">Sala</label>
        <select
          id="salaId"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
          formControlName="salaId"
        >
          <option value="">--Selecciona sala--</option>
          <option *ngFor="let sala of salas" [value]="sala.id">{{ sala.nombre }}</option>
        </select>
        <div *ngIf="hasError('salaId', 'required')" class="text-red-500 text-sm">
          El ID de la sala es obligatorio.
        </div>
      </div>


      <!-- Estado -->
      <div class="mb-4">
        <label for="estado" class="sr-only">Estado</label>
        <select
          id="estado"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
          formControlName="estado"
        >
          <option value="" disabled>Selecciona el estado</option>
          <option *ngFor="let est of estados" [value]="est">
            {{ est }}
          </option>
        </select>
        <div *ngIf="hasError('estado', 'required')" class="text-red-500 text-sm">
          El estado es obligatorio.
        </div>
      </div>

      <!-- Imagen del Evento -->
      <div class="mb-4">
        <label for="imagenEvento" class="sr-only">URL de la Imagen del Evento</label>
        <input
          id="imagenEvento"
          type="text"
          placeholder="URL de la Imagen del Evento"
          class="w-full p-3 rounded-full bg-gray-200 text-gray-800 placeholder-gray-500 focus:outline-none hover:bg-gray-300 focus:ring-2 focus:ring-gray-500 transition duration-300"
          formControlName="imagenEvento"
        />
      </div>

      <!-- Botón de guardar -->
      <button
        type="submit"
        class="w-full bg-customGrisOscurso hover:bg-gray-500 text-white py-3 rounded-full text-lg font-semibold transition duration-300"
        [disabled]="loading"
      >
        {{ loading ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </form>
  </div>
</div>
