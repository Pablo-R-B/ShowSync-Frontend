
  <div *ngIf="sala" class="bg-cover bg-center text-white " style="background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.1)), url('/assets/images/fondo_1.png');">
    <div class="flex flex-col items-center justify-center text-center py-16 px-4 md:px-12" >
    <!-- Título -->
    <div class="mb-10 relative z-10">
      <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl text-transparent bg-clip-text bg-gradient-to-r from-customBurbundy via-red-500 to-customBurbundy font-medula  drop-shadow-lg">
        {{ sala.nombre }}
      </h1>
      <p class="text-lg md:text-xl text-gray-300 max-w-4xl mx-auto mt-6 leading-relaxed">
        {{ sala.descripcion }}
      </p>
    </div>

    <!-- Información rápida -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full px-2 md:px-6">
      <div class="bg-customBlanco p-5 rounded-xl shadow-lg transition-all hover:ring hover:ring-red-200">
        <p class="font-bold text-customBurbundy">Capacidad</p>
        <p class="text-customBurbundy">{{ sala.capacidad }} personas</p>
      </div>
      <div class="bg-customBlanco p-5 rounded-xl shadow-lg transition-all hover:ring hover:ring-red-200">
        <p class="font-bold text-customBurbundy">Ubicación</p>
        <p class="text-customBurbundy">{{ sala.direccion }}</p>
      </div>
      <div class="bg-customBlanco p-5 rounded-xl shadow-lg transition-all hover:ring hover:ring-red-200">
        <p class="font-bold text-customBurbundy">Ciudad</p>
        <p class="text-customBurbundy">{{ sala.ciudad }}</p>
      </div>
      <div class="bg-customBlanco p-5 rounded-xl shadow-lg transition-all hover:ring hover:ring-red-200 text-center">
        <p class="font-bold text-customBurbundy mb-2">Fotos</p>
        <button (click)="abrirImagen()" class="text-customGrisOscurso hover:text-blue-800 underline">
          Ver imágenes
        </button>
      </div>
    </div>

      <!-- Modal de imagen -->
      <div *ngIf="mostrarModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white rounded-xl p-6 max-w-xl max-h-[90vh] overflow-auto relative shadow-lg">
          <button (click)="cerrarModal()" class="absolute top-3 right-4 text-gray-600 hover:text-black text-2xl font-bold">
            &times;
          </button>
          <img [src]="sala.imagen" alt="Imagen de {{ sala.nombre }}" class="rounded-lg max-w-full max-h-[80vh]" />
        </div>
      </div>
    </div>

    <!-- Calendario de disponibilidad -->
    <div class="calendario-container w-full mx-auto px-2 sm:px-4 md:px-6 lg:px-8 py-8 bg-white rounded-lg shadow-lg">
      <div class="calendario-header flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
        <h2 class="text-2xl font-bold text-white flex items-center">
          <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 002 2z" />
          </svg>
          Disponibilidad:
        </h2>

        <div class="leyenda-container">
          <div class="flex items-center gap-2">
            <div class="w-4 h-4 rounded bg-[#1B998B]"></div>
            <span>Confirmado</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-4 h-4 rounded bg-[#BF0D22]"></div>
            <span>En revisión</span>
          </div>
        </div>
      </div>

      <div class="calendario-wrapper ">
        <full-calendar #calendar [options]="calendarOptions"></full-calendar>
      </div>
    </div>

    <!-- Toast -->
    <p-toast></p-toast>

    <!-- Dialog Crear Evento -->
    <p-dialog
      [(visible)]="mostrarFormularioEvento"
      header="Crear nuevo evento"
      [modal]="true"
      [draggable]="false"
      [styleClass]="'custom-dialog w-[95%] sm:w-[80%] md:w-[65%] lg:w-[50%]'"
      (onHide)="cancelarEvento()"
    >

    <form
        (ngSubmit)="enviarEvento()"
        #eventoForm="ngForm"
        class="p-4 bg-black border-4 border-white rounded-lg space-y-4 text-white"
      >
        <!-- Nombre -->
        <div>
          <label class="block text-customRed font-medium mb-1">Nombre del evento *</label>
          <input
            type="text"
            pInputText
            name="nombre"
            [(ngModel)]="nuevoEvento.nombre"
            class="w-full p-inputtext-sm"
            required
            placeholder="Nombre del evento"
          />
        </div>

        <!-- Descripción -->
        <div>
          <label class="block text-customRed font-medium mb-1">Descripción *</label>
          <textarea
            pInputTextarea
            name="descripcion"
            [(ngModel)]="nuevoEvento.descripcion"
            class="w-full p-inputtextarea-sm"
            required
            rows="3"
            placeholder="Descripción del evento"
          ></textarea>
        </div>

        <!-- Fecha -->
        <div class="p-3 bg-customGrisClaro rounded-lg">
          <p class="font-medium text-customRed">Fecha seleccionada:</p>
          <p class="font-semibold text-black">{{ fechaSeleccionada | date: 'fullDate':'':'es' }}</p>
        </div>

        <!-- Géneros -->
        <div>
          <label class="block text-customRed font-medium mb-1">Géneros musicales *</label>
          <p-multiSelect
            [options]="generosDisponibles"
            [(ngModel)]="generosSeleccionados"
            name="generos"
            [showToggleAll]="false"
            placeholder="Selecciona géneros"
            required
            class="w-full"
          ></p-multiSelect>
        </div>

        <!-- Imagen -->
        <div>
          <label class="block text-customRed font-medium mb-1">Imagen del evento</label>
          <p-fileUpload
            #fileUpload
            mode="basic"
            name="imagenEvento"
            accept="image/*"
            chooseLabel="Seleccionar imagen"
            (onSelect)="onFileSelected($event)"
            [disabled]="imagenCargando"
            class="w-full"
          ></p-fileUpload>

          <!-- Cargando -->
          <div *ngIf="imagenCargando" class="mt-2 text-center">
            <i class="pi pi-spin pi-spinner text-customRed"></i>
            <span class="ml-2 text-customRed">Cargando imagen...</span>
          </div>

          <!-- Vista previa -->
          <div *ngIf="nuevoEvento.imagenEvento && !imagenCargando" class="mt-4">
            <div class="flex justify-between items-center mb-2">
              <p class="text-customRed font-semibold">Vista previa:</p>
              <button
                type="button"
                (click)="eliminarImagen()"
                class="text-red-400 hover:text-red-600 text-sm flex items-center"
              >
                <i class="pi pi-times mr-1"></i> Eliminar
              </button>
            </div>
            <img
              [src]="nuevoEvento.imagenEvento"
              alt="Vista previa"
              class="max-h-60 rounded shadow-lg border border-white"
            />
          </div>
        </div>

        <!-- Botones -->
        <div class="flex flex-col sm:flex-row justify-end gap-2 pt-2">
          <button
            pButton
            type="button"
            label="Cancelar"
            icon="pi pi-times"
            (click)="cancelarEvento()"
            class="p-button-outlined p-button-secondary w-full sm:w-auto"
          ></button>
          <button
            pButton
            type="submit"
            label="Enviar para revisión"
            icon="pi pi-check"
            [disabled]="!nuevoEvento.nombre || !nuevoEvento.descripcion || generosSeleccionados.length === 0 || cargando"
            [loading]="cargando"
            class="w-full sm:w-auto"
          ></button>
        </div>
      </form>
    </p-dialog>


  </div>
