<div *ngIf="sala" class="p-6 bg-customNegro rounded-2xl shadow-md mx-4 lg:mx-16" style="background-image: url('/assets/images/fondo_4.png'), linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5));">  <div class="flex flex-col items-center justify-center text-center">
    <!-- Header -->
    <div class="text-center mb-12 relative z-10">
      <div class="inline-block">
        <h1 class="text-5xl md:text-7xl lg:text-8xl text-transparent bg-clip-text bg-gradient-to-r from-customBurbundy via-red-500 to-customBurbundy font-medula mb-4 animate-pulse">
          {{ sala.nombre }}
        </h1>
        <div class="h-1 bg-gradient-to-r from-transparent via-customBurbundy to-transparent rounded-full"></div>
      </div>
      <p class="subtitle mt-4 text-customGrisClaro2">
        {{ sala.descripcion }}
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6 w-full">
      <div class="bg-customBlanco p-4 rounded-lg shadow">
        <p class="font-bold text-customBurbundy">Capacidad</p>
        <p class="text-customBurbundy">{{ sala.capacidad }} personas</p>
      </div>
      <div class="bg-customBlanco p-4 rounded-lg shadow">
        <p class="font-bold text-customBurbundy">Ubicación</p>
        <p class="text-customBurbundy">{{ sala.direccion }}</p>
      </div>
      <div class="bg-customBlanco p-4 rounded-lg shadow">
        <p class="font-bold text-customBurbundy">Ciudad</p>
        <p class="text-customBurbundy">{{ sala.ciudad }}</p>
      </div>
      <div class="bg-customBlanco p-4 rounded-lg shadow">
        <p class="font-bold text-customBurbundy mb-2">Fotos</p>
        <button (click)="abrirImagen()" class="text-customGrisOscurso hover:text-blue-800 cursor-pointer">
          Imágenes (+)
        </button>
      </div>

      <!-- Modal de imagen -->
      <div *ngIf="mostrarModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-4 max-w-xl max-h-[90vh] overflow-auto relative">
          <button (click)="cerrarModal()" class="absolute top-2 right-2 text-gray-600 hover:text-gray-900 font-bold text-xl">
            &times;
          </button>
          <img [src]="sala.imagen" alt="Imagen de {{ sala.nombre }}" class="max-w-full max-h-[80vh] rounded" />
        </div>
      </div>
    </div>

    <!-- Calendario de disponibilidad -->
    <div class="calendario-container w-full mx-auto px-2 sm:px-4 md:px-6 lg:px-8 py-4 bg-white rounded-lg shadow-lg">
      <div class="calendario-header flex flex-col sm:flex-row sm:items-center sm:justify-between mb-4 gap-4">
        <h2 class="text-2xl font-bold text-customNegro flex items-center">
          <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 002 2z" />
          </svg>
          Disponibilidad:
        </h2>

        <div class="leyenda-container">
          <div class="flex items-center gap-2">
            <div class="w-4 h-4 rounded bg-[#1B998B]"></div>
            <span>Confirmado</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-4 h-4 rounded bg-[#BF0D22]"></div>
            <span>En revisión</span>
          </div>
        </div>
      </div>

      <div class="calendario-wrapper">
        <full-calendar #calendar [options]="calendarOptions"></full-calendar>
      </div>
    </div>

    <!-- Toast -->
    <p-toast></p-toast>

    <!-- Dialog Crear Evento -->
    <p-dialog
      [(visible)]="mostrarFormularioEvento"
      [style]="{ width: '50vw' }"
      [modal]="true"
      [draggable]="false"
      header="Crear nuevo evento"
      (onHide)="cancelarEvento()"
    >
      <form (ngSubmit)="enviarEvento()" #eventoForm="ngForm" class="p-4">
        <div class="mb-4">
          <label class="block text-customBurbundy font-medium mb-2">Nombre del evento *</label>
          <input
            type="text"
            pInputText
            name="nombre"
            [(ngModel)]="nuevoEvento.nombre"
            class="w-full"
            required
            placeholder="Nombre del evento"
          />
        </div>

        <div class="mb-4">
          <label class="block text-customBurbundy font-medium mb-2">Descripción *</label>
          <textarea
            pInputTextarea
            name="descripcion"
            [(ngModel)]="nuevoEvento.descripcion"
            class="w-full"
            required
            rows="3"
            placeholder="Descripción del evento"
          ></textarea>
        </div>

        <div class="mb-4 p-3 bg-customGrisClaro rounded-lg">
          <p class="font-medium text-customBurbundy">Fecha seleccionada:</p>
          <p class="font-semibold">{{ fechaSeleccionada | date:'fullDate':'':'es' }}</p>
        </div>

        <div class="mb-4">
          <label class="block text-customBurbundy font-medium mb-2">Géneros musicales *</label>
          <p-multiSelect
            [options]="generosDisponibles"
            [(ngModel)]="generosSeleccionados"
            name="generos"
            [showToggleAll]="false"
            placeholder="Selecciona géneros"
            required
          ></p-multiSelect>
        </div>

        <div class="mb-4">
          <label class="block text-customBurbundy font-medium mb-2">Imagen del evento</label>
          <p-fileUpload
            #fileUpload
            mode="basic"
            name="imagenEvento"
            accept="image/*"
            chooseLabel="Seleccionar imagen"
            (onSelect)="onFileSelected($event)"
            [disabled]="imagenCargando"
            class="w-full"
          ></p-fileUpload>

          <!-- Indicador de carga -->
          <div *ngIf="imagenCargando" class="mt-2 text-center">
            <i class="pi pi-spin pi-spinner text-customBurbundy"></i>
            <span class="ml-2 text-customBurbundy">Cargando imagen...</span>
          </div>

          <!-- Vista previa -->
          <div *ngIf="nuevoEvento.imagenEvento && !imagenCargando" class="mt-4">
            <div class="flex justify-between items-center mb-2">
              <p class="text-customBurbundy font-semibold">Vista previa:</p>
              <button
                type="button"
                (click)="eliminarImagen()"
                class="text-red-500 hover:text-red-700 text-sm flex items-center"
              >
                <i class="pi pi-times mr-1"></i>
                Eliminar
              </button>
            </div>
            <img [src]="nuevoEvento.imagenEvento" alt="Vista previa" class="max-h-60 rounded shadow" />
          </div>
        </div>

        <div class="flex justify-end gap-2 mt-4">
          <button
            pButton
            type="button"
            label="Cancelar"
            icon="pi pi-times"
            (click)="cancelarEvento()"
            class="p-button-outlined p-button-secondary"
          ></button>
          <button
            pButton
            type="submit"
            label="Enviar para revisión"
            icon="pi pi-check"
            [disabled]="!nuevoEvento.nombre || !nuevoEvento.descripcion || generosSeleccionados.length === 0 || cargando"
            [loading]="cargando"
          ></button>
        </div>
      </form>
    </p-dialog>
  </div>
</div>
