<!-- Contenedor principal del chat -->

<div *ngIf="conectado" class="h-screen bg-red-500 flex items-center justify-center" style="background-size: contain; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), url('assets/images/img.png') repeat-y center;">
  <div class="w-[600px] h-[800px] bg-white rounded-3xl shadow-2xl flex flex-col">

    <!-- Cabecera del chat -->
    <nav class="h-16 bg-gray-800 rounded-t-3xl flex items-center justify-between px-4">
      <div class="flex items-center relative">
        <img [src]="imagenUsuario" class="w-10 h-10 rounded-full mr-3" />
        <span
          [ngClass]="conectado ? 'bg-green-500' : 'bg-gray-500'"
          class="absolute bottom-0 right-0 w-2 h-2 rounded-full ring-2 ring-white">
        </span>
        <span class="text-lg font-semibold text-gray-200">{{ nombreUsuario }}</span>
      </div>
      <div class="flex items-center space-x-4 text-gray-300 text-xl">
        <i class="mdi mdi-video"></i>
        <i class="mdi mdi-phone"></i>
        <i class="mdi mdi-dots-vertical"></i>
      </div>
      <button (click)="volver()" class="flex items-center justify-center gap-2 text-gray-200 hover:text-white transition px-6 py-3 rounded-full border border-gray-600 hover:border-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        <span>Volver</span>
      </button>
    </nav>

    <!-- Área de mensajes -->
    <div class="flex-1 overflow-y-auto px-4 py-4" id="journal-scroll">
      <div *ngFor="let msg of mensajes">
        <ng-container [ngSwitch]="msg.tipo">

          <!-- Artista o Bot (lado izquierdo) -->
          <div *ngSwitchCase="'artista'" class="flex items-center pr-20 pt-2">
            <div class="relative inline-block mr-3">
              <img [src]="msg.imagen" class="inline-block w-11 h-11 rounded-full shadow" />
              <span class="absolute top-0 end-0 block w-3 h-3 rounded-full ring-2 ring-white bg-teal-400"></span>
            </div>
            <span class="bg-gray-800 text-gray-200 text-sm rounded-lg px-4 py-2 flex items-end space-x-2">
              <span>{{ msg.texto }}</span>
              <span class="text-gray-400 text-xs">{{ msg.hora }}</span>
            </span>
          </div>

          <div *ngSwitchCase="'bot'" class="flex items-center pr-20 pt-2">
            <div class="relative inline-block mr-3">
              <img [src]="msg.imagen" class="inline-block w-11 h-11 rounded-full shadow" />
              <span class="absolute top-0 end-0 block w-3 h-3 rounded-full ring-2 ring-white bg-teal-400"></span>
            </div>
            <span class="bg-gray-800 text-gray-200 text-sm rounded-lg px-4 py-2 flex items-end space-x-2">
              <span>{{ msg.texto }}</span>
              <span class="text-gray-400 text-xs">{{ msg.hora }}</span>
            </span>
          </div>

          <!-- Promotor (lado derecho) -->
          <div *ngSwitchCase="'promotor'" class="flex justify-end items-center pl-20 pt-2">
            <span class="bg-green-700 text-gray-200 text-sm rounded-lg px-4 py-2 flex items-end space-x-2">
              <span>{{ msg.texto }}</span>
              <span class="text-gray-400 text-xs">{{ msg.hora }}</span>
            </span>
            <div class="relative inline-block ml-3">
              <img [src]="msg.imagen" class="inline-block w-11 h-11 rounded-full shadow" />
              <span class="absolute top-0 end-0 block w-3 h-3 rounded-full ring-2 ring-white bg-teal-400"></span>
            </div>
          </div>

        </ng-container>
      </div>
    </div>

    <!-- Input de mensajes -->
    <div class="sticky bottom-0 flex items-center justify-between p-4 bg-gray-200 rounded-b-3xl">
      <div class="relative w-full">
        <i class="mdi mdi-emoticon-excited-outline absolute top-3 left-3 text-gray-500 text-2xl"></i>
        <input
          [(ngModel)]="mensajeInput"
          type="text"
          placeholder="Escribe un mensaje..."
          class="w-full rounded-full pl-12 pr-16 py-3 bg-white text-gray-800 placeholder-gray-500 text-sm focus:outline-none shadow"
        />
        <i class="mdi mdi-paperclip absolute right-12 top-3 -rotate-45 text-gray-500 text-xl"></i>
        <i class="mdi mdi-camera absolute right-6 top-3 text-gray-500 text-xl"></i>
      </div>

      <!-- Botón enviar -->
      <button
        type="button"
        class="text-white bg-customRed hover:bg-customGrisMedio focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm p-2.5 text-center inline-flex items-center me-2"
        (click)="enviarMensaje()"
        [disabled]="!mensajeInput.trim()"
      >
        <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9" />
        </svg>
        <span class="sr-only">Enviar mensaje</span>
      </button>
    </div>

  </div>
</div>
