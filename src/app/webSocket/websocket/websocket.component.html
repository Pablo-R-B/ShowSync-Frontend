<div class="pt-20"> <!-- Ajusta pt-20 (padding top) según el alto de tu header -->
  <h2 class="text-center text-2xl font-semibold mb-4">Mensajes del WebSocket</h2>

  <div class="flex gap-2 justify-center mb-4 px-4 max-w-xl mx-auto">
    <input
      type="text"
      [(ngModel)]="mensajeInput"
      placeholder="Escribe un mensaje"
      class="flex-1 p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    <button
      (click)="enviarMensaje()"
      [disabled]="!mensajeInput.trim()"
      class="bg-blue-600 text-white px-4 rounded font-semibold disabled:opacity-50 disabled:cursor-not-allowed hover:bg-blue-700 transition"
    >
      Enviar
    </button>
  </div>

  <p *ngIf="!conectado" class="text-red-600 text-center font-bold mb-2">❌ No conectado</p>
  <p *ngIf="conectado" class="text-green-600 text-center font-bold mb-2">✅ Conectado</p>

  <ul
    class="max-h-72 overflow-y-auto border border-gray-300 rounded bg-gray-50 max-w-xl mx-auto px-4 py-2"
  >
    <li
      *ngFor="let msg of mensajes"
      class="border-b border-gray-200 py-1 last:border-b-0 font-sans text-gray-700"
    >
      {{ msg }}
    </li>
  </ul>
</div>
